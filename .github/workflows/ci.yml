name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Software tests without model downloads
        run: python -m unittest discover -s tests
      - name: Audit published benchmark arithmetic
        run: python scripts/audit_benchmarks.py
      - name: Check Python syntax
        run: python -m compileall -q flux_klein_mlx scripts benchmarks
      - name: Build code-only wheel
        run: |
          python -m pip install build
          python -m build
          python scripts/check_wheel.py
