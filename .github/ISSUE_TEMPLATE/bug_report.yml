name: Bug report
description: Help reproduce an installation or inference failure.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Mac and environment
      description: Chip, unified memory, macOS, Python and package versions.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and error
      description: Include the full command and error; remove tokens and personal paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include variant, preset, seed and canvas size for generation issues.
    validations:
      required: true
