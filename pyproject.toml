[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-3-image-klein-mlx"
version = "0.1.0"
description = "Local FLUX.3 Image Klein generation and editing on Apple Silicon with MLX"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE-runtime.txt"]
dependencies = ["mlx==0.32.4", "mlx-metal==0.32.4", "numpy==2.5.4", "Pillow==12.3.0", "tokenizers==0.22.2", "torch==2.14.1"]

[project.optional-dependencies]
hub = ["huggingface_hub>=1,<3"]

[project.urls]
Homepage = "https://github.com/devin-lai/flux-3-image-klein-mlx"
Models = "https://huggingface.co/devin-lai/flux-3-image-klein-mlx"
Issues = "https://github.com/devin-lai/flux-3-image-klein-mlx/issues"
Benchmarks = "https://github.com/devin-lai/flux-3-image-klein-mlx/blob/main/reports/macbook-pro-32gb.md"

[project.scripts]
flux-klein = "flux_klein_mlx.__main__:main"

[tool.setuptools]
packages = ["flux_klein_mlx"]
